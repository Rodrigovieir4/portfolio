name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verificar:
    name: Formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          NEXT_PUBLIC_SITE_URL: https://rodrigovsousa.dev

  e2e:
    name: Ponta a ponta (jogo e site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verificar
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build do app
        run: bunx turbo run build --filter=@portfolio/web
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3200

      # O jogo roda em WebGL e o runner nao tem placa de video: o Chromium
      # desenha em software com o SwiftShader, configurado no playwright.config.
      - name: Instalar Chromium do Playwright
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: bun run --filter @portfolio/web test:e2e

      - name: Guardar rastros das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
